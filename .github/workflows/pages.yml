name: Deploy game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: dist
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 10); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq github-pages; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Pages artifact is not visible yet. Re-run this deployment."
          exit 1
      - name: Publish
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the upload's exact ID: the artifact REST API can already see
            // it while deploy-pages' job-scoped discovery still returns zero.
            const repo = context.repo;
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0)
              throw new Error('Upload did not return a valid artifact ID.');
            const { data: artifact } = await github.request(
              'GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}',
              { ...repo, artifact_id: artifactId }
            );
            if (artifact.expired || artifact.name !== 'github-pages')
              throw new Error('The uploaded Pages artifact is unavailable.');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              { ...repo, artifact_id: artifactId,
                pages_build_version: context.sha, oidc_token: idToken }
            );
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID.');
            core.setOutput('page_url', deployment.page_url);
            const failed = new Set(['deployment_failed', 'deployment_perms_error',
              'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            const deadline = Date.now() + 600000;
            let succeeded = false;
            try {
              while (Date.now() < deadline) {
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                  { ...repo, deployment_id: deploymentId }
                );
                if (data.status === 'succeed') {
                  succeeded = true;
                  core.info(`Pages deployment ${deploymentId} succeeded.`);
                  return;
                }
                if (failed.has(data.status)) throw new Error(`Pages: ${data.status}`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              throw new Error('Pages deployment timed out after ten minutes.');
            } finally {
              if (!succeeded) {
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                  { ...repo, deployment_id: deploymentId }
                ).catch(() => core.warning('Could not cancel the incomplete deployment.'));
              }
            }
